<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f7f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1714" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApniCars Admin</title>
    <script>
      (() => {
        const stored = localStorage.getItem("apnicars_admin_theme");
        const theme = stored === "light" || stored === "dark"
          ? stored
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
